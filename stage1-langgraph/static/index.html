<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>local-rag-qa · 本地知识库问答</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --accent: #1e40af;
    --accent-soft: #eef2ff;
    --border: #e2e8f0;
    --green: #059669;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  header { text-align: center; margin-bottom: 28px; }
  header h1 { font-size: 24px; font-weight: 700; color: var(--accent); }
  header p { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .badge {
    display: inline-block; font-size: 12px; color: var(--accent);
    background: var(--accent-soft); padding: 2px 10px; border-radius: 12px;
    margin-top: 10px;
  }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; font-weight: 700; margin-bottom: 12px; color: var(--accent); }

  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  input[type=text] {
    flex: 1; min-width: 240px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
  }
  button {
    padding: 10px 18px; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 14px; cursor: pointer;
  }
  button:hover { opacity: .9; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.secondary { background: #fff; color: var(--accent); border: 1px solid var(--accent); }

  #status { font-size: 13px; color: var(--muted); margin-top: 10px; min-height: 20px; }

  .chat-box { min-height: 120px; }
  .qa { margin-bottom: 18px; }
  .qa .q { font-weight: 700; margin-bottom: 6px; }
  .qa .q::before { content: "问　"; color: var(--accent); }
  .qa .a { white-space: pre-wrap; }
  .qa .a::before { content: "答　"; color: var(--green); font-weight: 700; }

  .sources { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 10px; }
  .sources h3 { font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
  .src {
    font-size: 13px; color: var(--muted); background: #f8fafc;
    border-left: 3px solid var(--accent); padding: 8px 10px; margin-bottom: 6px;
    border-radius: 0 6px 6px 0; max-height: 120px; overflow-y: auto;
  }
  .src .src-file { font-size: 12px; color: var(--accent); margin-bottom: 4px; font-weight: 600; }

  .hint { font-size: 13px; color: var(--muted); }
  code { background: var(--accent-soft); padding: 1px 6px; border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>本地知识库问答</h1>
    <p>LangGraph 内核 · 把文档喂进去，本地零成本问答</p>
    <span class="badge">Stage 1 · StateGraph 版</span>
  </header>

  <div class="card">
    <h2>① 建索引</h2>
    <div class="row">
      <input type="text" id="docsDir" placeholder="文档目录路径，例如 ./sample_docs" value="./sample_docs">
      <button id="ingestBtn">建索引</button>
    </div>
    <div id="status"></div>
  </div>

  <div class="card">
    <h2>② 提问</h2>
    <div class="row">
      <input type="text" id="question" placeholder="输入你的问题，回车发送" value="">
      <button id="askBtn">提问</button>
    </div>
    <div class="chat-box" id="chatBox"></div>
  </div>

  <p class="hint">
    提示：先建索引（放入 <code>.txt</code> 文档），再提问。答案下方会展示「检索到的证据片段」，
    这是 RAG 与普通聊天最大的区别：答案有据可查。
  </p>
</div>

<script>
const status = document.getElementById('status');
const chatBox = document.getElementById('chatBox');
const docsDir = document.getElementById('docsDir');
const question = document.getElementById('question');

function setStatus(msg, ok = true) {
  status.textContent = msg;
  status.style.color = ok ? '#059669' : '#dc2626';
}

document.getElementById('ingestBtn').addEventListener('click', async () => {
  const btn = document.getElementById('ingestBtn');
  btn.disabled = true; setStatus('正在建索引，首次较慢请稍候...');
  try {
    const r = await fetch('/api/ingest', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ docs_dir: docsDir.value })
    });
    const d = await r.json();
    if (d.error) { setStatus('建索引失败：' + d.error, false); return; }
    setStatus(`建索引完成，共 ${d.chunks} 个片段`, true);
  } catch (e) {
    setStatus('建索引失败：' + e.message, false);
  } finally { btn.disabled = false; }
});

async function ask() {
  const q = question.value.trim();
  if (!q) return;
  const btn = document.getElementById('askBtn');
  btn.disabled = true; setStatus('思考中...');
  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ question: q })
    });
    const d = await r.json();
    if (d.error) { setStatus(d.error, false); return; }

    const div = document.createElement('div');
    div.className = 'qa';
    div.innerHTML = `<div class="q"></div><div class="a"></div>`;
    div.querySelector('.q').textContent = q;
    div.querySelector('.a').textContent = d.answer;

    if (d.documents && d.documents.length) {
      const s = document.createElement('div');
      s.className = 'sources';
      s.innerHTML = '<h3>检索到的证据片段（k=' + d.documents.length + '）</h3>';
      d.documents.forEach((doc, i) => {
        const src = document.createElement('div');
        src.className = 'src';
        src.innerHTML = '<div class="src-file">' + (d.sources?.[i] || '片段 ' + (i+1)) + '</div>';
        src.appendChild(document.createTextNode(doc));
        s.appendChild(src);
      });
      div.appendChild(s);
    }
    chatBox.prepend(div);
    question.value = '';
    setStatus('', true);
  } catch (e) {
    setStatus('问答失败：' + e.message, false);
  } finally { btn.disabled = false; }
}

document.getElementById('askBtn').addEventListener('click', ask);
question.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
